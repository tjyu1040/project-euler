[build-system]
requires = ["setuptools>=82.0.1", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "euler"
dynamic = ["version"]
requires-python = ">= 3.14"
dependencies = [
    "numpy>=2.3.4",
]

[project.optional-dependencies]
dev = [
    "pre-commit>=4.3.0",
    "ruff>=0.14.1",
]
test = [
    "pytest>=8.4.2",
    "pytest-cov>=7.0.0",
]

[tool.setuptools_scm]

[tool.ruff]
line-length = 120
indent-width = 4

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
docstring-code-format = true
docstring-code-line-length = "dynamic"

[tool.ruff.lint]
extend-select = [
    "I"  # isort
]

[tool.pytest.ini_options]
addopts = [
    "--import-mode=importlib",
    "--durations=25"
]
